# Build the site and publish it to GitHub Pages.
#
# Deploys from the built output rather than committing `dist/`, so the repo
# stays source-only and the staging link always reflects `staging`.
#
# ── Why this is on a push trigger again ──────────────────────────────────
#
# It was manual-only because Pages could not be switched on at all:
# Type-B-Digital was on the free plan, and Pages from a PRIVATE repository
# needs Pro, Team or Enterprise. The API refused it outright —
#
#   POST /repos/Type-B-Digital/Website-3.0/pages
#   422 "Your current plan does not support GitHub Pages for this repository."
#
# The repository is PUBLIC now, at Eduardo's direction, which is what unblocked
# it. Note what that means: a Pages site has no access control below Enterprise
# Cloud, so this URL is readable by anyone who has it. It is not a private
# preview and must not be treated as one.
#
# ── Which branch is live ─────────────────────────────────────────────────
#
# `staging`, not `main`. Work lands on staging by default (see
# docs/BUILD_LOG.md § Branches and where a push goes), so that is the branch
# the client link should follow. `main` stays the release branch and does NOT
# deploy — the `github-pages` environment allows both branches, so pointing
# this at `main` later is a one-line change here.
name: Deploy staging site

on:
  push:
    branches: [staging]
  workflow_dispatch:

# Let a newer push supersede an in-flight deploy, but never cancel a deploy
# half-done — Pages would be left serving a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `base` must match the path Pages serves from, which for a project site
      # is /<repo>/. Taken from the Pages config rather than hardcoded so a
      # rename or a custom domain does not silently break every asset URL.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on for the repo on first run, with GitHub Actions as the
          # source, instead of requiring a manual visit to Settings -> Pages.
          enablement: true

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
