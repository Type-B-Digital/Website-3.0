# Build the site and publish it to GitHub Pages.
#
# Deploys from the built output rather than committing `dist/`, so the repo
# stays source-only and the staging link always reflects `main`.
#
# `configure-pages` enables Pages on first run (`enablement: true`), so no
# manual visit to Settings -> Pages is needed.
name: Deploy staging site

# Manual only. `configure-pages` has `enablement: true` and would normally
# switch Pages on itself, but it cannot here: Type-B-Digital is on the free
# plan, and GitHub Pages from a PRIVATE repository needs Pro, Team or
# Enterprise. The API says so directly —
#
#   POST /repos/Type-B-Digital/Website-3.0/pages
#   422 "Your current plan does not support GitHub Pages for this repository."
#
# So a push trigger only produces a red X on every commit. Three ways out, none
# of them a code change: make the repo public, upgrade the org, or point
# Netlify / Cloudflare Pages at it (both build from a private repo on their free
# tier, and both can password-protect the preview).
#
# Once Pages is actually available, add back:
#
#   push:
#     branches: [main]
#
# and the staging link tracks `main` on its own.
on:
  workflow_dispatch:

# Let a newer push supersede an in-flight deploy, but never cancel a deploy
# half-done — Pages would be left serving a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `base` must match the path Pages serves from, which for a project site
      # is /<repo>/. Taken from the Pages config rather than hardcoded so a
      # rename or a custom domain does not silently break every asset URL.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          # Turn Pages on for the repo on first run, with GitHub Actions as the
          # source, instead of requiring a manual visit to Settings -> Pages.
          enablement: true

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
